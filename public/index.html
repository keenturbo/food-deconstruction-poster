<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>解构式美食海报</title>
  <link rel="stylesheet" href="/payment-modal.css" />
  <style>
    :root {
      --bg: #050507;
      --card: rgba(255, 255, 255, 0.04);
      --card-strong: rgba(255, 255, 255, 0.08);
      --accent: #ffb347;
      --accent-2: #ff6f3c;
      --muted: #9aa0b5;
      --text: #f7f7fb;
      --border: rgba(255, 255, 255, 0.12);
      --sample: url('https://food.snippet.pp.ua/food-poster.png.jpeg');
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      font-family: "Space Grotesk", "Noto Sans SC", "Inter", system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at 20% 20%, rgba(255, 111, 60, 0.12), transparent 30%),
                  radial-gradient(circle at 80% 0%, rgba(255, 179, 71, 0.14), transparent 28%),
                  var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    .page {
      max-width: 1400px;
      margin: 0 auto;
      padding: 28px 18px 48px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }
    h1 { margin: 8px 0 6px; font-size: 28px; letter-spacing: -0.4px; }
    p.lead { margin: 0; color: var(--muted); max-width: 780px; line-height: 1.6; }
    .layout { display: grid; grid-template-columns: 0.8fr 1.2fr; gap: 18px; align-items: start; }
    @media (max-width: 980px) { .layout { grid-template-columns: 1fr; } }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
      backdrop-filter: blur(6px);
      box-shadow: 0 18px 40px rgba(0,0,0,0.25);
    }
    .card-strong { background: var(--card-strong); border: 1px solid rgba(255,255,255,0.16); }
    .section-title { display: flex; align-items: center; gap: 10px; font-size: 16px; margin: 0 0 10px; letter-spacing: 0.2px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), var(--accent-2)); flex-shrink: 0; }

    form { display: flex; flex-direction: column; gap: 14px; }
    label { font-size: 13px; color: var(--muted); }
    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.02);
      color: var(--text);
      font-size: 15px;
    }
    input[type="text"]:focus, input[type="password"]:focus { outline: 1px solid var(--accent); border-color: var(--accent); }
    button.primary {
      padding: 14px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #0a0b0f;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      transition: transform 0.08s ease, box-shadow 0.08s ease;
    }
    button.primary:active { transform: translateY(1px); box-shadow: inset 0 2px 6px rgba(0,0,0,0.25); }
    button[disabled] { opacity: 0.6; cursor: not-allowed; }

    .status { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 14px; }
    .dotping { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 0 rgba(255,179,71,0.5); animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255,179,71,0.6); } 70% { box-shadow: 0 0 0 12px rgba(255,179,71,0); } 100% { box-shadow: 0 0 0 0 rgba(255,179,71,0); } }

    .result-panel {
      position: relative;
      min-height: 1400px;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: #0b0c12;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: 14px;
    }
    @media (max-width: 980px) {
      .result-panel { min-height: 95vh; }
    }
    .result-panel::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0.8) 100%),
                  var(--sample) center/contain no-repeat;
      filter: saturate(0.9);
      z-index: 0;
    }
    .result {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 1fr;
      align-items: center;
      justify-items: center;
      gap: 12px;
      align-content: start;
    }
    .result img {
      width: 100%;
      max-width: 100%;
      height: auto;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #0b0c12;
      object-fit: contain;
    }
    .hidden { display: none !important; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; }
    .ghost-btn { padding: 12px 14px; border-radius: 12px; border: 1px solid var(--border); background: transparent; color: var(--text); cursor: pointer; }
    .result-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 16px; margin: 0 0 10px; letter-spacing: 0.2px; position: relative; z-index: 1; }
    .result-title { display: inline-flex; align-items: center; gap: 10px; font-size: 16px; letter-spacing: 0.2px; }
    .state { font-size: 14px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }

    .counter-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
    .counter { font-size: 12px; color: var(--muted); }
    .link-btn {
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.04);
      color: var(--text);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 12px;
      cursor: pointer;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
      padding: 18px;
    }
    .modal {
      background: #0b0c12;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      max-width: 460px;
      width: 100%;
      color: var(--text);
      box-shadow: 0 18px 40px rgba(0,0,0,0.35);
    }
    .modal h3 { margin: 0 0 8px; font-size: 20px; }
    .modal p { margin: 0 0 12px; color: var(--muted); line-height: 1.5; }
    .modal-actions { display: flex; gap: 10px; flex-wrap: wrap; }
    .btn-secondary {
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.04);
      color: var(--text);
      cursor: pointer;
      flex: 1;
      text-align: center;
      text-decoration: none;
    }
    .qr {
      width: 140px;
      height: 140px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #0f0f12;
      object-fit: contain;
    }

    .error-hint { color: #ff6b6b; font-size: 13px; margin-top: 4px; }
    .error-hint a { color: var(--accent); text-decoration: underline; cursor: pointer; }

    .price-tag {
      display: inline-block;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #0a0b0f;
      font-weight: 700;
      font-size: 13px;
      padding: 4px 10px;
      border-radius: 8px;
      margin-left: 8px;
    }

    .poll-status {
      background: rgba(255, 179, 71, 0.12);
      border: 1px solid rgba(255, 179, 71, 0.25);
      border-radius: 12px;
      padding: 14px;
      margin-top: 10px;
      font-size: 13px;
      color: var(--text);
      line-height: 1.6;
    }
    .poll-status .order-id {
      font-family: ui-monospace, monospace;
      background: rgba(0,0,0,0.3);
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div>
        <h1>解构式美食海报 <span class="price-tag">¥5/张</span></h1>
        <p class="lead">输入美食名称，自动拆解食材层次、质感与文化风格，生成纯黑背景的商业级分层海报。付款确认后显示图片。</p>
      </div>
    </header>

    <div class="layout">
      <div class="card card-strong">
        <div class="section-title"><span class="dot"></span><span>提交美食名称</span></div>
        <form id="generate-form">
          <div>
            <label for="food-input">美食名称</label>
            <input id="food-input" name="food_name" type="text" placeholder="例：红烧牛肉面 / Peking Duck" required />
          </div>
          <button class="primary" type="submit" id="submit-btn">生成分层海报（¥5）</button>
          <div class="counter-row">
            <div class="counter" id="limit-counter"></div>
            <button class="link-btn" type="button" id="add-key-btn">添加自己的 key（免费）</button>
          </div>
          <div class="status" id="status-row"><span class="dotping"></span><span id="status-text">等待输入...</span></div>
          <div id="poll-status-box" class="poll-status hidden"></div>
        </form>
      </div>

      <div class="result-panel">
        <div class="result-header">
          <div class="result-title"><span class="dot"></span><span>生成结果</span></div>
          <div class="state" id="result-state">未生成</div>
        </div>
        <div class="result">
          <img id="result-image" class="hidden" alt="生成的美食解构海报" />
          <div class="actions hidden" id="result-actions">
            <button class="primary" type="button" id="download-btn">下载图片</button>
            <button class="ghost-btn" type="button" id="retry-btn">再生成一次</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="key-modal" class="modal-backdrop hidden">
    <div class="modal">
      <h3>添加你的 Gemini API Key</h3>
      <p>填入你自己的付费层级 Google Gemini API Key，本地保存（LocalStorage），仅你可见，优先调用，无需付费直接生成。</p>
      <div style="margin-bottom:12px;">
        <input id="user-key-input" type="password" placeholder="粘贴你的 Gemini API Key" />
      </div>
      <div class="modal-actions">
        <button class="primary" type="button" onclick="saveUserKey()">保存</button>
        <button class="ghost-btn" type="button" onclick="closeKeyModal()">取消</button>
        <button class="ghost-btn" type="button" onclick="clearUserKey()" style="color:#ff6b6b;">清除</button>
      </div>
    </div>
  </div>

  <script src="/payment-modal.js"></script>
  <script>
    const form = document.getElementById('generate-form');
    const foodInput = document.getElementById('food-input');
    const submitBtn = document.getElementById('submit-btn');
    const statusText = document.getElementById('status-text');
    const resultImg = document.getElementById('result-image');
    const resultActions = document.getElementById('result-actions');
    const resultState = document.getElementById('result-state');
    const retryBtn = document.getElementById('retry-btn');
    const downloadBtn = document.getElementById('download-btn');
    const limitCounter = document.getElementById('limit-counter');
    const keyModal = document.getElementById('key-modal');
    const addKeyBtn = document.getElementById('add-key-btn');
    const userKeyInput = document.getElementById('user-key-input');
    const pollStatusBox = document.getElementById('poll-status-box');

    const LS_KEY = 'gemini_user_key';
    const PRICE = '5';

    const sampleImages = [
      'https://food.snippet.pp.ua/IMG_5076.jpeg',
      'https://food.snippet.pp.ua/IMG_5079.jpeg',
      'https://food.snippet.pp.ua/IMG_5082.jpeg',
      'https://food.snippet.pp.ua/IMG_5083.jpeg',
      'https://food.snippet.pp.ua/IMG_5084.jpeg',
      'https://food.snippet.pp.ua/IMG_5085.jpeg',
      'https://food.snippet.pp.ua/IMG_5087.jpeg',
      'https://food.snippet.pp.ua/food-poster.png.jpeg',
      'https://food.snippet.pp.ua/food-poster.png%204.jpeg',
      'https://icon.pp.ua/file/1765515078682_food-poster.png_5.jpeg',
      'https://food.snippet.pp.ua/IMG_5090.jpeg',
      'https://food.snippet.pp.ua/IMG_5091.jpeg',
      'https://food.snippet.pp.ua/Z.jpeg'
    ];
    const pick = sampleImages[Math.floor(Math.random() * sampleImages.length)];
    document.documentElement.style.setProperty('--sample', `url('${pick}')`);

    let pendingImageData = null;
    let currentOrderId = null;
    let pollInterval = null;
    let imageGenerating = false;

    function getUserKey() {
      return localStorage.getItem(LS_KEY) || '';
    }

    function saveUserKey() {
      const val = userKeyInput.value.trim();
      if (val) {
        localStorage.setItem(LS_KEY, val);
      } else {
        localStorage.removeItem(LS_KEY);
      }
      closeKeyModal();
      updateCounterUI();
    }

    function clearUserKey() {
      localStorage.removeItem(LS_KEY);
      userKeyInput.value = '';
      closeKeyModal();
      updateCounterUI();
    }

    function openKeyModal() {
      userKeyInput.value = getUserKey();
      keyModal.classList.remove('hidden');
    }

    function closeKeyModal() {
      keyModal.classList.add('hidden');
    }

    function updateCounterUI() {
      const hasUserKey = !!getUserKey();
      if (hasUserKey) {
        limitCounter.textContent = '已加载自定义 Key，无需付费';
        submitBtn.textContent = '生成分层海报';
      } else {
        limitCounter.textContent = '付费模式：¥' + PRICE + '/张';
        submitBtn.textContent = '生成分层海报（¥' + PRICE + '）';
      }
    }

    async function generateImageInBackground(foodName, userKey) {
      imageGenerating = true;
      pendingImageData = null;
      try {
        const resp = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            character_name: foodName,
            style: 'food_poster',
            customKey: userKey || ''
          })
        });

        if (!resp.ok) {
          let errorMsg = '生成失败：' + resp.status;
          try {
            const errData = await resp.json();
            if (errData.error) errorMsg = errData.error;
          } catch (e) {}
          console.error('图片生成失败:', errorMsg);
          imageGenerating = false;
          return;
        }

        const data = await resp.json();
        if (data.image_url) {
          pendingImageData = data.image_url;
          console.log('图片已生成，等待订单确认后展示');
        }
      } catch (err) {
        console.error('图片生成异常:', err);
      }
      imageGenerating = false;
    }

    async function generateWithUserKey(foodName) {
      statusText.textContent = '正在解构美食...';
      resultState.textContent = '生成中...';
      submitBtn.disabled = true;
      resultImg.classList.add('hidden');
      resultActions.classList.add('hidden');

      try {
        const userKey = getUserKey();
        const resp = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            character_name: foodName,
            style: 'food_poster',
            customKey: userKey
          })
        });

        if (!resp.ok) {
          let errorMsg = '生成失败：' + resp.status;
          try {
            const errData = await resp.json();
            if (errData.error) errorMsg = errData.error;
          } catch (e) {}
          throw new Error(errorMsg);
        }

        const data = await resp.json();
        if (!data.image_url) throw new Error('未返回图片地址');

        resultImg.src = data.image_url;
        resultImg.classList.remove('hidden');
        resultActions.classList.remove('hidden');
        statusText.textContent = '生成完成';
        resultState.textContent = '生成完成';
      } catch (err) {
        statusText.textContent = '错误：' + err.message;
        resultState.textContent = '生成失败';
      } finally {
        submitBtn.disabled = false;
      }
    }

    function startPolling(orderId) {
      currentOrderId = orderId;
      pollStatusBox.classList.remove('hidden');
      updatePollStatus('pending');

      if (pollInterval) clearInterval(pollInterval);

      pollInterval = setInterval(async () => {
        try {
          const status = await PaymentModal.getOrderStatus({ orderId: orderId });
          if (status.success) {
            if (status.status === 'confirmed') {
              clearInterval(pollInterval);
              pollInterval = null;
              onOrderConfirmed();
            } else if (status.status === 'rejected') {
              clearInterval(pollInterval);
              pollInterval = null;
              onOrderRejected();
            } else {
              updatePollStatus('pending');
            }
          }
        } catch (err) {
          console.error('轮询失败:', err);
        }
      }, 3000);
    }

    function updatePollStatus(status) {
      if (status === 'pending') {
        let msg = `<strong>订单已提交，等待确认...</strong><br>`;
        msg += `订单ID: <span class="order-id">${currentOrderId || '-'}</span><br>`;
        if (imageGenerating) {
          msg += `图片状态: 生成中...`;
        } else if (pendingImageData) {
          msg += `图片状态: 已就绪，确认后立即显示`;
        } else {
          msg += `图片状态: 准备中...`;
        }
        pollStatusBox.innerHTML = msg;
      }
    }

    function onOrderConfirmed() {
      pollStatusBox.innerHTML = '<strong style="color:#4ade80;">✓ 订单已确认！</strong>';

      if (pendingImageData) {
        showImage(pendingImageData);
      } else if (imageGenerating) {
        statusText.textContent = '订单已确认，图片生成中...';
        resultState.textContent = '生成中...';
        const checkReady = setInterval(() => {
          if (pendingImageData) {
            clearInterval(checkReady);
            showImage(pendingImageData);
          } else if (!imageGenerating) {
            clearInterval(checkReady);
            statusText.textContent = '图片生成失败，请联系客服';
            resultState.textContent = '生成失败';
          }
        }, 500);
      } else {
        statusText.textContent = '图片生成失败，请联系客服';
        resultState.textContent = '生成失败';
      }

      setTimeout(() => {
        pollStatusBox.classList.add('hidden');
      }, 3000);
    }

    function onOrderRejected() {
      pollStatusBox.innerHTML = '<strong style="color:#ff6b6b;">✗ 订单未通过</strong><br>如有疑问请联系客服';
      statusText.textContent = '订单未确认';
      resultState.textContent = '订单未确认';
      pendingImageData = null;
    }

    function showImage(imageUrl) {
      resultImg.src = imageUrl;
      resultImg.classList.remove('hidden');
      resultActions.classList.remove('hidden');
      statusText.textContent = '生成完成';
      resultState.textContent = '生成完成';
    }

    function handlePaidGenerate(foodName) {
      statusText.textContent = '请完成付款...';
      resultState.textContent = '等待付款';
      submitBtn.disabled = true;
      resultImg.classList.add('hidden');
      resultActions.classList.add('hidden');
      pollStatusBox.classList.add('hidden');

      pendingImageData = null;
      currentOrderId = null;
      if (pollInterval) {
        clearInterval(pollInterval);
        pollInterval = null;
      }

      generateImageInBackground(foodName, '');

      PaymentModal.open({
        foodName: foodName,
        food_name: foodName,
        character_name: foodName,
        style: 'food_poster'
      });
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const foodName = foodInput.value.trim();
      if (!foodName) return;

      const userKey = getUserKey();
      if (userKey) {
        generateWithUserKey(foodName);
      } else {
        handlePaidGenerate(foodName);
      }
    });

    downloadBtn.addEventListener('click', () => {
      if (!resultImg.src) return;
      const link = document.createElement('a');
      link.href = resultImg.src;
      link.download = 'food-poster.png';
      link.click();
    });

    retryBtn.addEventListener('click', () => {
      const foodName = foodInput.value.trim() || '红烧牛肉面';
      const userKey = getUserKey();
      if (userKey) {
        generateWithUserKey(foodName);
      } else {
        handlePaidGenerate(foodName);
      }
    });

    addKeyBtn.addEventListener('click', openKeyModal);

    window.addEventListener('DOMContentLoaded', () => {
      updateCounterUI();

      PaymentModal.init({
        price: PRICE,
        currency: '¥',
        wechatQR: 'https://pic.snippet.pp.ua/generated/IMG_4859.jpeg',
        alipayQR: 'https://pic.snippet.pp.ua/generated/IMG_4859.jpeg',
        enableHongbao: true,
        apiGenerateOrder: '/api/generate-order',
        apiSubmitOrder: '/api/order',
        apiOrderStatus: '/api/order-status',
        texts: {
          title: '扫码付款',
          subtitle: '付款后点击确认，管理员审核后显示图片',
          orderHint: '付款时请备注此订单号',
          confirmBtn: '已完成付款',
          cancelBtn: '取消',
          hongbaoSteps: '1) 打开支付宝搜索「口令红包」\n2) 发一个 ¥' + PRICE + ' 的口令红包\n3) 复制口令，粘贴到下方\n4) 点击「已完成付款」'
        },
        onSuccess: (info) => {
          console.log('订单提交成功:', info);
          statusText.textContent = '订单已提交，等待确认...';
          resultState.textContent = '等待确认';
          submitBtn.disabled = false;
          startPolling(info.orderId);
        },
        onError: (msg) => {
          console.error('订单提交失败:', msg);
          statusText.textContent = '订单提交失败：' + msg;
          resultState.textContent = '提交失败';
          submitBtn.disabled = false;
        },
        onClose: () => {
          if (!currentOrderId) {
            submitBtn.disabled = false;
            statusText.textContent = '已取消';
            resultState.textContent = '未生成';
          }
        }
      });
    });
  </script>
</body>
</html>
